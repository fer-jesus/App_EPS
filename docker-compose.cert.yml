version: '3.8'

services:
  # Proxy para Nginx y certificados
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - nginx-proxy
    restart: always

  nginx-proxy-acme:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-proxy-acme
    environment:
      DEFAULT_EMAIL: admin@dotmunijalapa.org
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    networks:
      - nginx-proxy
    depends_on:
      - nginx-proxy
    restart: always

  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: dot_db_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: lic_const_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dot_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - nginx-proxy
    expose:
      - "3306"

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_node
    restart: always
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 12345
      DB_NAME: lic_const_db
      DB_PORT: 3306
      VIRTUAL_HOST: backdot.dotmunijalapa.org
      LETSENCRYPT_HOST: backdot.dotmunijalapa.org
      LETSENCRYPT_EMAIL: admin@dotmunijalapa.org
      VIRTUAL_PORT: 3001
      NODE_ENV: production
    networks:
      - nginx-proxy
    expose:
      - "3001"
    command: sh -c "while ! nc -z db 3306 ; do sleep 1 ; done && npm run start"

  # Frontend React (producción con Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend_react
    restart: always
    environment:
      VIRTUAL_HOST: applic.dotmunijalapa.org
      LETSENCRYPT_HOST: applic.dotmunijalapa.org
      LETSENCRYPT_EMAIL: admin@dotmunijalapa.org
      VIRTUAL_PORT: 80
    networks:
      - nginx-proxy
    expose:
      - "80"

volumes:
  certs:
  vhost:
  html:
  dot_data:

networks:
  nginx-proxy:
    external: true

